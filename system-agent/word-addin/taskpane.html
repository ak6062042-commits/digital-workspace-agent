<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace Writing Assistant</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font:14px Segoe UI,sans-serif;background:#101112;color:#eee;margin:0;padding:18px}h2{font-size:16px;color:#d4ff00;margin-top:0}input,select,button{box-sizing:border-box;width:100%;margin:6px 0;padding:9px;border-radius:5px;border:1px solid #34373a;background:#1a1c1e;color:#eee}button{background:#d4ff00;color:#111;font-weight:700;cursor:pointer}.hint,#status{font-size:12px;color:#b1b5b9;line-height:1.5}#result{white-space:pre-wrap;background:#17191b;border-radius:5px;padding:10px;margin-top:12px;line-height:1.5}#related{margin-top:10px;padding:10px;background:#17191b;border-radius:5px}#related h3{font-size:12px;margin:0 0 5px;color:#d4ff00}#related button{background:#222;color:#d4ff00;border-color:#555;text-align:left;font-size:12px}</style></head><body>
<h2>Workspace Writing Assistant</h2><p class="hint">Select text in Word, choose an action, then click Analyze. Nothing is read or sent until you click.</p>
<input id="token" type="password" placeholder="Local API token" autocomplete="off"><select id="operation"><option value="improve">Suggest improvements</option><option value="summarize">Summarize selection</option><option value="explain">Explain selection</option><option value="ideas">Suggest ideas</option></select><button id="analyze">Analyze selected text</button><div id="status">Waiting for a selection.</div><div id="result" hidden></div><div id="related" hidden></div><script src="taskpane.js"></script></body></html>
