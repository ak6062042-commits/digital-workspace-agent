version: '3.8'

services:
  backend:
    image: python:3.11-slim
    container_name: workspace_backend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=sqlite:///./backend/db/app.db
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install --no-cache-dir -r backend/requirements.txt &&
               uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-slim
    container_name: workspace_frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
