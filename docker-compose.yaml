services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    env_file: .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ALLOW_CONTAINER_BIND: "true"
      DATABASE_URL: sqlite:///./backend/db/app.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r backend/requirements.txt &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    environment:
      VITE_API_TOKEN: ${API_TOKEN}
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
